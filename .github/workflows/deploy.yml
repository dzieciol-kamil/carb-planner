name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Production (carbfueling.com root) only moves on a new vX.Y.Z tag —
      # master alone never touches it. Preview always tracks master, so you
      # can review a change before deciding it's ready to tag as a release.
      - name: Find latest release tag
        id: tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "::error::No vX.Y.Z tag found in the repo — nothing to deploy as production." >&2
            exit 1
          fi
          echo "Latest release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build production (${{ steps.tag.outputs.tag }}) into site root
        run: |
          git checkout "${{ steps.tag.outputs.tag }}"
          npm ci
          npm test
          npm run build
          mkdir -p "$RUNNER_TEMP/site"
          cp -r dist/. "$RUNNER_TEMP/site/"

      # This calls `vite build` directly, not `npm run build`, so scripts/build-faq.mjs never
      # runs here — the /faq pages only get generated for tagged production releases (see the
      # "Build production" step above). Known, accepted limitation: on /preview, the footer's
      # FAQ link (src/components/Footer.tsx) will 404 before the first tag after this lands, and
      # after that first tag it will silently navigate a preview session out to the *production*
      # FAQ content (since the footer's href isn't base-aware). Not fixed here — if FAQ preview
      # review becomes valuable, build-faq.mjs needs to become base-aware first (it currently
      # hardcodes `SITE`, `/faq`, `/pl/faq`, and `href="/"` throughout).
      - name: Build preview (master) into /preview
        run: |
          git checkout master
          npm ci
          npm test
          npx vite build --base=/preview/
          mkdir -p "$RUNNER_TEMP/site/preview"
          cp -r dist/. "$RUNNER_TEMP/site/preview/"
          sed -i 's#<head>#<head>\n    <meta name="robots" content="noindex, nofollow" />#' "$RUNNER_TEMP/site/preview/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
