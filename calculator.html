<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator izotoniku 2:1</title>
    <style>
        /* Reset i podstawy */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f6fc;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 30px 30px 40px;
            box-shadow: 0 15px 40px rgba(0, 20, 40, 0.12);
        }
        h1 {
            text-align: center;
            font-weight: 700;
            font-size: 2rem;
            color: #1a2b3c;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        h1 small {
            font-weight: 400;
            font-size: 1rem;
            color: #5e7a99;
            display: block;
            margin-top: 4px;
        }
        .card {
            background: #fafcff;
            border-radius: 18px;
            padding: 22px 25px;
            margin-bottom: 25px;
            border: 1px solid #e6edf6;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .card h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f3a57;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2 i {
            font-style: normal;
            font-size: 1.5rem;
        }

        /* Sekcja czasu */
        .time-input {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px 25px;
        }
        .time-input label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            color: #1f3a57;
        }
        .time-input input[type="number"] {
            width: 80px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #cddae9;
            background: white;
            font-size: 1rem;
            font-weight: 500;
            transition: 0.15s;
        }
        .time-input input[type="number"]:focus {
            outline: none;
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.15);
        }
        .time-input .carbs-label {
            margin-left: 10px;
        }
        .result-target {
            margin-top: 18px;
            padding: 12px 18px;
            background: #e3f0ff;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #0b3b6b;
            display: inline-block;
            border: 1px solid #b8d3f0;
        }
        .result-target span {
            font-size: 1.6rem;
            color: #004e9e;
            margin: 0 4px;
        }

        /* Lista bidonów */
        .bottle-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            padding: 12px 0;
            border-bottom: 1px solid #e9f0f8;
        }
        .bottle-row:last-child {
            border-bottom: none;
        }
        .bottle-row .vol-display {
            font-weight: 600;
            color: #1f3a57;
            min-width: 70px;
        }
        .bottle-row input[type="number"] {
            width: 85px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #cddae9;
            background: white;
            font-size: 0.95rem;
        }
        .bottle-row input[type="number"]:focus {
            outline: none;
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.12);
        }
        .bottle-row .conc-label {
            font-weight: 500;
            color: #2c4a6a;
            margin-right: 4px;
        }
        .bottle-row .results {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            background: #f2f7fe;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            border: 1px solid #dae6f5;
            flex: 1 1 auto;
            min-width: 280px;
        }
        .bottle-row .results span {
            white-space: nowrap;
        }
        .bottle-row .results .val {
            font-weight: 600;
            color: #00337a;
        }
        .bottle-row .btn-remove {
            background: #ffebee;
            border: none;
            color: #b71c1c;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.9rem;
            border: 1px solid #f5c6cb;
        }
        .bottle-row .btn-remove:hover {
            background: #fce4ec;
            border-color: #e57373;
        }

        .btn-add {
            background: #2a7de1;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(42, 125, 225, 0.2);
        }
        .btn-add:hover {
            background: #1a5fb0;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(42, 125, 225, 0.3);
        }

        /* Podsumowanie */
        .summary {
            margin-top: 22px;
            padding: 18px 22px;
            background: #eaf2fb;
            border-radius: 16px;
            border: 1px solid #c9dcef;
        }
        .summary h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.15rem;
            color: #103a5e;
        }
        .summary-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 30px;
        }
        .summary-grid div {
            font-weight: 500;
            color: #1f3a57;
        }
        .summary-grid .val {
            font-weight: 700;
            color: #00337a;
            font-size: 1.1rem;
        }

        /* checkbox */
        .bottle-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #2a7de1;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* responsywność */
        @media (max-width: 700px) {
            .container {
                padding: 20px 16px;
            }
            .bottle-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .bottle-row .results {
                min-width: unset;
                width: 100%;
                justify-content: center;
                border-radius: 12px;
            }
            .time-input {
                flex-direction: column;
                align-items: stretch;
            }
            .time-input label {
                justify-content: space-between;
            }
            .time-input input[type="number"] {
                width: 100%;
            }
            .result-target {
                width: 100%;
                text-align: center;
            }
            .summary-grid {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧪 Kalkulator izotoniku <small>maltodekstryna : fruktoza &nbsp;2:1</small></h1>

    <!-- Sekcja czasu -->
    <section class="card">
        <h2><i>⏱️</i> Czas aktywności</h2>
        <div class="time-input">
            <label>Godziny <input type="number" id="hours" value="0" min="0" step="0.5"></label>
            <label>Minuty <input type="number" id="minutes" value="0" min="0" max="59" step="1"></label>
            <label class="carbs-label">Zapotrzebowanie <input type="number" id="carbsPerHour" value="60" min="0" step="1"> g/h</label>
        </div>
        <div class="result-target">
            🎯 Docelowa ilość cukru: <span id="targetCarbs">0.0</span> g
        </div>
    </section>

    <!-- Sekcja bidonów -->
    <section class="card">
        <h2><i>🧴</i> Mieszanka na bidony</h2>
        <div id="bottlesContainer">
            <!-- wiersze będą generowane przez JS -->
        </div>
        <button class="btn-add" id="addBottleBtn">➕ Dodaj własną pojemność</button>

        <div class="summary">
            <h3>📊 Podsumowanie (wszystkie zaznaczone bidony)</h3>
            <div class="summary-grid">
                <div>Mieszanka: <span class="val" id="totalMix">0.0</span> g</div>
                <div>Maltodekstryna: <span class="val" id="totalMaltodextrin">0.0</span> g</div>
                <div>Fruktoza: <span class="val" id="totalFructose">0.0</span> g</div>
                <div>Sól: <span class="val" id="totalSalt">0.0</span> g</div>
                <div>Kwasek cytrynowy: <span class="val" id="totalCitric">0.0</span> g</div>
            </div>
        </div>
    </section>
</div>

<script>
    (function() {
        // ----- Stałe przeliczniki (na 250 ml) -----
        const SALT_PER_250 = 0.4;    // g
        const CITRIC_PER_250 = 0.5;  // g

        // ----- Elementy DOM -----
        const container = document.getElementById('bottlesContainer');
        const hoursInput = document.getElementById('hours');
        const minutesInput = document.getElementById('minutes');
        const carbsPerHourInput = document.getElementById('carbsPerHour');
        const targetCarbsSpan = document.getElementById('targetCarbs');

        const totalMixSpan = document.getElementById('totalMix');
        const totalMaltSpan = document.getElementById('totalMaltodextrin');
        const totalFructSpan = document.getElementById('totalFructose');
        const totalSaltSpan = document.getElementById('totalSalt');
        const totalCitricSpan = document.getElementById('totalCitric');

        // ----- Funkcja tworząca wiersz bidonu -----
        function createBottleRow(volume, concentration, checked, isCustom) {
            const row = document.createElement('div');
            row.className = 'bottle-row';

            // Checkbox
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'bottle-check';
            cb.checked = checked;
            row.appendChild(cb);

            // Pojemność – dla domyślnych tylko etykieta, dla własnych input
            if (isCustom) {
                const volInput = document.createElement('input');
                volInput.type = 'number';
                volInput.className = 'bottle-volume';
                volInput.value = volume;
                volInput.min = 0;
                volInput.step = 1;
                volInput.placeholder = 'ml';
                row.appendChild(volInput);
                row.appendChild(document.createTextNode(' ml'));
            } else {
                const volSpan = document.createElement('span');
                volSpan.className = 'vol-display';
                volSpan.textContent = volume + ' ml';
                row.appendChild(volSpan);
                // ukryte pole do odczytu w updateAll
                const hiddenVol = document.createElement('input');
                hiddenVol.type = 'hidden';
                hiddenVol.className = 'bottle-volume';
                hiddenVol.value = volume;
                row.appendChild(hiddenVol);
            }

            // Stężenie (g/250 ml)
            const concInput = document.createElement('input');
            concInput.type = 'number';
            concInput.className = 'bottle-concentration';
            concInput.value = concentration;
            concInput.min = 0;
            concInput.step = 0.1;
            concInput.placeholder = 'g/250ml';
            row.appendChild(concInput);
            const concLabel = document.createElement('span');
            concLabel.className = 'conc-label';
            concLabel.textContent = 'g/250 ml';
            row.appendChild(concLabel);

            // Wyniki
            const resultsDiv = document.createElement('div');
            resultsDiv.className = 'results';
            resultsDiv.innerHTML = `
                <span>🧂 Miesz: <span class="val result-mix">0.0</span>g</span>
                <span>🍚 Malt: <span class="val result-malt">0.0</span>g</span>
                <span>🍯 Fruk: <span class="val result-fruct">0.0</span>g</span>
                <span>🧂 Sól: <span class="val result-salt">0.0</span>g</span>
                <span>🍋 Kwasek: <span class="val result-citric">0.0</span>g</span>
            `;
            row.appendChild(resultsDiv);

            // Przycisk usuwania (tylko dla własnych)
            if (isCustom) {
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕ Usuń';
                delBtn.className = 'btn-remove';
                delBtn.type = 'button';
                delBtn.addEventListener('click', function(e) {
                    row.remove();
                    updateAll();
                });
                row.appendChild(delBtn);
            }

            // Eventy – każda zmiana wywołuje updateAll
            const inputs = row.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.addEventListener('input', updateAll);
                inp.addEventListener('change', updateAll);
            });
            cb.addEventListener('change', updateAll);

            return row;
        }

        // ----- Inicjalizacja domyślnych bidonów -----
        const defaultBottles = [
            { volume: 710, concentration: 21, checked: true },
            { volume: 620, concentration: 21, checked: true },
            { volume: 250, concentration: 21, checked: true }
        ];

        defaultBottles.forEach(b => {
            const row = createBottleRow(b.volume, b.concentration, b.checked, false);
            container.appendChild(row);
        });

        // ----- Przycisk dodawania własnego -----
        document.getElementById('addBottleBtn').addEventListener('click', function() {
            const row = createBottleRow(500, 21, true, true);
            container.appendChild(row);
            updateAll();
        });

        // ----- Eventy dla czasu i zapotrzebowania -----
        [hoursInput, minutesInput, carbsPerHourInput].forEach(el => {
            el.addEventListener('input', updateAll);
            el.addEventListener('change', updateAll);
        });

        // ----- Główna funkcja przeliczająca -----
        function updateAll() {
            // 1. Docelowa ilość cukru z czasu
            const hours = parseFloat(hoursInput.value) || 0;
            const minutes = parseFloat(minutesInput.value) || 0;
            const carbsPerHour = parseFloat(carbsPerHourInput.value) || 0;
            const totalHours = hours + minutes / 60;
            const targetCarbs = totalHours * carbsPerHour;
            targetCarbsSpan.textContent = targetCarbs.toFixed(1);

            // 2. Przeliczanie każdego wiersza
            const rows = document.querySelectorAll('.bottle-row');
            let sumMix = 0, sumMalt = 0, sumFruct = 0, sumSalt = 0, sumCitric = 0;

            rows.forEach(row => {
                const cb = row.querySelector('.bottle-check');
                const isChecked = cb.checked;

                // Pobranie pojemności (dla własnych – input, dla domyślnych – hidden)
                const volInput = row.querySelector('.bottle-volume');
                let volume = 0;
                if (volInput) {
                    volume = parseFloat(volInput.value) || 0;
                }

                const concInput = row.querySelector('.bottle-concentration');
                const concentration = parseFloat(concInput.value) || 0;

                // Elementy wyników
                const mixSpan = row.querySelector('.result-mix');
                const maltSpan = row.querySelector('.result-malt');
                const fructSpan = row.querySelector('.result-fruct');
                const saltSpan = row.querySelector('.result-salt');
                const citricSpan = row.querySelector('.result-citric');

                if (isChecked && volume > 0 && concentration > 0) {
                    const mix = (volume / 250) * concentration;
                    const malt = mix * (2/3);
                    const fruct = mix * (1/3);
                    const salt = (volume / 250) * SALT_PER_250;
                    const citric = (volume / 250) * CITRIC_PER_250;

                    mixSpan.textContent = mix.toFixed(1);
                    maltSpan.textContent = malt.toFixed(1);
                    fructSpan.textContent = fruct.toFixed(1);
                    saltSpan.textContent = salt.toFixed(1);
                    citricSpan.textContent = citric.toFixed(1);

                    sumMix += mix;
                    sumMalt += malt;
                    sumFruct += fruct;
                    sumSalt += salt;
                    sumCitric += citric;
                } else {
                    mixSpan.textContent = '0.0';
                    maltSpan.textContent = '0.0';
                    fructSpan.textContent = '0.0';
                    saltSpan.textContent = '0.0';
                    citricSpan.textContent = '0.0';
                }
            });

            // 3. Podsumowanie
            totalMixSpan.textContent = sumMix.toFixed(1);
            totalMaltSpan.textContent = sumMalt.toFixed(1);
            totalFructSpan.textContent = sumFruct.toFixed(1);
            totalSaltSpan.textContent = sumSalt.toFixed(1);
            totalCitricSpan.textContent = sumCitric.toFixed(1);
        }

        // ----- Pierwsze przeliczenie -----
        updateAll();
    })();
</script>
</body>
</html>
